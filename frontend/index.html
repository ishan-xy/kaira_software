<!DOCTYPE html>
<html>
<head>
    <title>AI Voice Assistant</title>
    <meta charset="UTF-8">
    <style>
        html, body {
            height: 100%;
            margin: 0;
        }
        body {
            background-color: black;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: left;
        }
        
        .container {
            width: 90%;
            max-width: 800px;
            margin: auto;
        }

        #textDisplay {
            white-space: pre-wrap;
            font-size: 16px;
            border: 1px solid #444;
            padding: 10px;
            min-height: 150px;
            background-color: #111;
        }
        .yellow {
            color: yellow;
        }
        .cyan {
            color: cyan;
        }

        #aiResponseDisplay {
            border-top: 2px solid #555;
            margin-top: 20px;
            padding-top: 10px;
            font-size: 1.1em;
        }
        #aiResponseDisplay p {
            margin: 8px 0;
            line-height: 1.4;
        }
    </style>
</head>
<body>
    
    <div class="container">
        <div id="textDisplay"></div>

        <div id="aiResponseDisplay"></div>
    </div>

    <script>
        // --- Global Variables ---
        
        let socket = new WebSocket("ws://localhost:8001");
        const serverCheckInterval = 5000;
        
        let pc; 
        let audioContext;
        let nextTime = 0;
        const geminiSampleRate = 24000; 
        const webrtcRetryDelay = 3000;

        const displayDiv = document.getElementById('textDisplay');
        const aiDisplayDiv = document.getElementById('aiResponseDisplay');
        let fullSentences = [];
        let server_available = false;
        let mic_available = false;
        let webrtc_available = false; 

        // --- MODIFIED ---
        // 'canSendAudio' is renamed to 'isTranscriberReady' to clarify it's the SERVER's state
        let isTranscriberReady = false;
        // --- NEW ---
        // This variable will track if the user is holding the spacebar
        let isSpacebarPressed = false;

        // --- NEW: Keep track of the current AI response element ---
        let currentAIResponseElement = null;

        // --- 1. UI & Display Functions ---

        function displayAIResponse(responseText) {
            if (aiDisplayDiv) {
                let p = document.createElement('p');
                p.innerHTML = `<strong>🤖 AI:</strong> ${responseText}`; 
                aiDisplayDiv.appendChild(p);
                aiDisplayDiv.scrollTop = aiDisplayDiv.scrollHeight; 
            } else {
                console.warn("Element with id 'aiResponseDisplay' not found.");
            }
        }

        function displayRealtimeText(realtimeText, displayDiv) {
            let displayedText = fullSentences.map((sentence, index) => {
                let span = document.createElement('span');
                span.textContent = sentence + " ";
                span.className = index % 2 === 0 ? 'yellow' : 'cyan';
                return span.outerHTML;
            }).join('') + realtimeText;

            displayDiv.innerHTML = displayedText;
        }

        // --- MODIFIED ---
        // Updated UI messages for push-to-talk
        function start_msg() {
            if (!mic_available)
                displayRealtimeText("🎤  please allow microphone access  🎤", displayDiv);
            else if (!server_available)
                displayRealtimeText("🖥️  connecting to server...  🖥️", displayDiv);
            else if (!webrtc_available)
                displayRealtimeText("🔊  connecting to audio stream...  🔊", displayDiv);
            else if (!isTranscriberReady) 
                displayRealtimeText("🎙️  waiting for transcriber...  🎙️", displayDiv);
            else {
                // Logic for PTT
                if (isSpacebarPressed) {
                    displayRealtimeText("👄 ... Speaking ... 👄", displayDiv);
                } else {
                    displayRealtimeText("🎙️ Hold SPACE to talk 🎙️", displayDiv);
                }
            }
        }

        // --- 2. WebSocket Logic (Mic -> Server) (MODIFIED) ---

        function handleSocketMessage(event) {
            let data;
            try {
                 data = JSON.parse(event.data);
            } catch (e) {
                console.error("Received non-JSON message:", event.data);
                return;
            }

            switch (data.type) {
                // --- User speech transcription (unchanged) ---
                case 'realtime':
                    displayRealtimeText(data.text, displayDiv);
                    break;
                case 'fullSentence':
                    fullSentences.push(data.text);
                    displayRealtimeText("", displayDiv);
                    break;

                // --- MODIFIED ---
                // Renamed variable for clarity
                case 'pauseAudio':
                    console.warn("Pausing audio transmission (server not ready).");
                    isTranscriberReady = false;
                    start_msg();
                    break;
                case 'resumeAudio':
                    console.log("Resuming audio transmission (server is ready).");
                    isTranscriberReady = true;
                    start_msg();
                    break;

                // --- NEW: AI Response Streaming (No change here) ---
                case 'aiResponseStart':
                    currentAIResponseElement = document.createElement('p');
                    currentAIResponseElement.innerHTML = `<strong>🤖 AI:</strong> `;
                    aiDisplayDiv.appendChild(currentAIResponseElement);
                    
                    currentAIResponseElement.innerHTML += data.text;
                    aiDisplayDiv.scrollTop = aiDisplayDiv.scrollHeight; 
                    break;

                case 'aiResponseChunk':
                    if (currentAIResponseElement) {
                        currentAIResponseElement.innerHTML += data.text;
                        aiDisplayDiv.scrollTop = aiDisplayDiv.scrollHeight; 
                    }
                    break;
                
                case 'aiResponseFinal':
                    if (currentAIResponseElement) {
                        currentAIResponseElement.innerHTML = `<strong>🤖 AI:</strong> ${data.text}`; 
                    }
                    currentAIResponseElement = null; 
                    aiDisplayDiv.scrollTop = aiDisplayDiv.scrollHeight; 
                    break;
            }
        }

        function connectToServer() {
            socket = new WebSocket("ws://localhost:8001");

            socket.onopen = function() {
                server_available = true;
                start_msg();
            };

            socket.onmessage = handleSocketMessage; 

            socket.onclose = function() {
                server_available = false;
                // --- MODIFIED ---
                isTranscriberReady = false; 
                start_msg();
            };
            
            socket.onerror = function() {
                server_available = false;
                // --- MODIFIED ---
                isTranscriberReady = false; 
                start_msg();
            }
        }

        setInterval(() => {
            if (!server_available) connectToServer();
        }, serverCheckInterval);

        // --- 3. WebRTC Logic (Server Audio -> Client) (No changes) ---

        function initAudio() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)({
                    sampleRate: geminiSampleRate 
                });
                nextTime = audioContext.currentTime;
                console.log('✅ AudioContext initialized for Gemini playback.');
            }
        }

        async function processAudioChunk(arrayBuffer) {
            if (!audioContext) {
                console.warn("AudioContext not ready, but received audio chunk.");
                return;
            }
            if (arrayBuffer.byteLength === 0) return;

            const int16View = new Int16Array(arrayBuffer);
            const float32Array = new Float32Array(int16View.length);
            for (let i = 0; i < int16View.length; i++) {
                float32Array[i] = int16View[i] / 32768.0; 
            }

            const audioBuffer = audioContext.createBuffer(
                1, float32Array.length, geminiSampleRate
            );
            audioBuffer.getChannelData(0).set(float32Array);

            const source = audioContext.createBufferSource();
            source.buffer = audioBuffer;
            source.connect(audioContext.destination);

            const playTime = Math.max(audioContext.currentTime, nextTime);
            source.start(playTime);
            
            nextTime = playTime + audioBuffer.duration;
        }

        async function connectWebRTC() {
            pc = new RTCPeerConnection({
                iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] 
            });

            pc.oniceconnectionstatechange = () => {
                const state = pc.iceConnectionState;
                console.log(`ICE Connection State: ${state}`);
                if (state === 'failed' || state === 'disconnected' || state === 'closed') {
                    if (webrtc_available) { 
                        console.warn("WebRTC connection lost. Retrying...");
                    }
                    webrtc_available = false;
                    start_msg();
                    pc.close(); 
                    setTimeout(connectWebRTC, webrtcRetryDelay);
                }
            };
            
            try {
                const data_channel = pc.createDataChannel("audio");
                data_channel.binaryType = 'arraybuffer';

                data_channel.onopen = () => {
                    console.log("✅ WebRTC Data Channel OPEN.");
                    initAudio(); 
                    webrtc_available = true;
                    start_msg();
                };

                data_channel.onmessage = (event) => {
                    if (event.data instanceof ArrayBuffer) {
                        processAudioChunk(event.data);
                    }
                };

                data_channel.onclose = () => {
                    console.warn("WebRTC Data Channel CLOSED. Retrying...");
                    webrtc_available = false;
                    start_msg();
                };
                
                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer);

                console.log("Sending WebRTC Offer to backend (port 8081)...");

                const response = await fetch('http://localhost:8081/offer', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        sdp: pc.localDescription.sdp,
                        type: pc.localDescription.type,
                    }),
                });

                if (!response.ok) {
                    throw new Error(`Signaling server returned ${response.status}`);
                }

                const answer = await response.json();
                console.log("Received WebRTC Answer.");
                
                await pc.setRemoteDescription(new RTCSessionDescription(answer));
                
            } catch (error) {
                console.error('WebRTC setup failed:', error);
                webrtc_available = false;
                start_msg();
                pc.close();
                setTimeout(connectWebRTC, webrtcRetryDelay);
            }
        }

        // --- 4. Initialization ---

        // --- NEW ---
        // Add event listeners for the spacebar to control push-to-talk
        window.addEventListener('keydown', (event) => {
            // Check if the key is Space and it's not already held down
            if (event.code === 'Space' && !isSpacebarPressed) {
                event.preventDefault(); // Stop the page from scrolling
                isSpacebarPressed = true;
                start_msg(); // Update UI to "Speaking..."
            }
        });

        window.addEventListener('keyup', (event) => {
            if (event.code === 'Space') {
                event.preventDefault();
                isSpacebarPressed = false;
                start_msg(); // Update UI to "Hold SPACE..."
            }
        });
        // --- END NEW ---


        connectToServer();
        connectWebRTC();
        start_msg();

        navigator.mediaDevices.getUserMedia({ audio: true })
        .then(stream => {
            let micAudioContext = new AudioContext();
            let source = micAudioContext.createMediaStreamSource(stream);
            let processor = micAudioContext.createScriptProcessor(256, 1, 1);

            source.connect(processor);
            processor.connect(micAudioContext.destination);
            mic_available = true;
            start_msg();

            processor.onaudioprocess = function(e) {
                
                // --- MODIFIED ---
                // Now checks for BOTH server readiness AND spacebar press
                if (socket.readyState !== WebSocket.OPEN || !isTranscriberReady || !isSpacebarPressed) {
                    return;
                }
                
                let inputData = e.inputBuffer.getChannelData(0);
                let outputData = new Int16Array(inputData.length);

                for (let i = 0; i < inputData.length; i++) {
                    outputData[i] = Math.max(-32768, Math.min(32767, inputData[i] * 32768));
                }
                
                let metadata = JSON.stringify({ sampleRate: micAudioContext.sampleRate });
                let metadataBytes = new TextEncoder().encode(metadata);
                
                let metadataLength = new ArrayBuffer(4);
                let metadataLengthView = new DataView(metadataLength);
                metadataLengthView.setInt32(0, metadataBytes.byteLength, true); 
                
                let combinedData = new Blob([metadataLength, metadataBytes, outputData.buffer]);
                
                socket.send(combinedData);
            };
        })
        .catch(e => {
            console.error(e);
            mic_available = false;
            start_msg();
        });

    </script>
</body>
</html>
